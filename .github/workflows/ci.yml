# Сборка окружения, pytest и проверка Docker-образа.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUMO_HOME: /usr/share/sumo
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SUMO и системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            software-properties-common \
            ca-certificates \
            curl
          sudo add-apt-repository -y ppa:sumo/stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sumo \
            sumo-tools \
            sumo-doc \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev
          sumo --version | head -1
          echo "SUMO_HOME=${SUMO_HOME}" >> "${GITHUB_ENV}"
          echo "${SUMO_HOME}/bin" >> "${GITHUB_PATH}"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: TraCI / sumolib (версия = бинарник SUMO)
        run: |
          SUMO_VER="$(sumo --version 2>&1 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [[ -z "${SUMO_VER}" ]]; then
            SUMO_VER="$(sumo --version 2>&1 | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          fi
          echo "SUMO_VER=${SUMO_VER}"
          python -m pip install --upgrade pip
          pip install "traci==${SUMO_VER}" "sumolib==${SUMO_VER}"

      - name: Зависимости Python
        run: pip install -r requirements.txt

      - name: Проверка TraCI
        run: |
          python -c "import traci; assert hasattr(traci.edge, 'getLastStepPersonIDs')"
          python -c "import ray; import torch; import src.simulation.env"

      - name: Pytest
        run: python -m pytest tests/ -q --tb=short

      - name: Smoke CLI
        run: python main.py --help

  docker:
    name: Сборка Docker
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t traffic-control:ci .

      - name: Smoke в контейнере
        run: docker run --rm traffic-control:ci --help
